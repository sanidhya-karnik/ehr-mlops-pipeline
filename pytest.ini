[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output settings
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (require running services)
    slow: Slow tests (>10 seconds)
    smoke: Quick smoke tests

# Timeouts
timeout = 300

# Async
asyncio_mode = auto

# Coverage (when using pytest-cov)
[coverage:run]
source = src
omit = 
    */tests/*
    */__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
