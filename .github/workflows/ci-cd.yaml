# =============================================================================
# CI/CD Pipeline
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  TERRAFORM_VERSION: "1.6.0"

jobs:
  # ===========================================================================
  # Lint & Test
  # ===========================================================================
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install ruff black pytest pytest-cov psycopg2-binary boto3 scikit-learn pandas fastapi
      
      - name: Lint with Ruff
        run: ruff check src/ --output-format=github || true
      
      - name: Check formatting
        run: black --check src/ || true
      
      - name: Run tests
        run: pytest tests/ -v --tb=short || true

  # ===========================================================================
  # Terraform Validation
  # ===========================================================================
  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Terraform Format
        run: terraform fmt -check -recursive
        working-directory: terraform
        continue-on-error: true
      
      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: terraform/environments/dev
      
      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform/environments/dev

  # ===========================================================================
  # Kubernetes Validation
  # ===========================================================================
  kubernetes:
    name: K8s Validate
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
      
      - name: Validate manifests
        run: |
          kubectl kustomize k8s/overlays/dev > /dev/null
          echo "Kustomize build successful"

  # ===========================================================================
  # dbt Validation
  # ===========================================================================
  dbt:
    name: dbt Validate
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dbt
        run: pip install dbt-core dbt-postgres
      
      - name: dbt Parse
        run: |
          cd dbt
          dbt parse --profiles-dir . || true

  # ===========================================================================
  # Build Docker Images
  # ===========================================================================
  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: [lint-test, terraform, kubernetes]
    if: github.event_name == 'push'
    
    strategy:
      matrix:
        service: [serving, training]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          push: false
          tags: mimic-mlops-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
